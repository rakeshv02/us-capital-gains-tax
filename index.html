<body style="margin:0;background:#f8faff;font-family:'Segoe UI',Arial,sans-serif">
<div id="root"></div>
<script type="text/babel">
//<![CDATA[
const { useState } = React;
function fmt(n){return '$'+Math.round(n).toLocaleString();}

// 2026 long-term CGT brackets (0%, 15%, 20%)
const LTCG_BRACKETS = {
  single:      [{ limit: 48350, rate: 0 }, { limit: 533400, rate: 0.15 }, { limit: Infinity, rate: 0.20 }],
  married:     [{ limit: 96700, rate: 0 }, { limit: 600050, rate: 0.15 }, { limit: Infinity, rate: 0.20 }],
  hoh:         [{ limit: 64750, rate: 0 }, { limit: 566700, rate: 0.15 }, { limit: Infinity, rate: 0.20 }],
};

// 2026 ordinary income brackets for short-term
const ST_BRACKETS = {
  single:  [{ limit: 11925, rate: 0.10 }, { limit: 48475, rate: 0.12 }, { limit: 103350, rate: 0.22 }, { limit: 197300, rate: 0.24 }, { limit: 250525, rate: 0.32 }, { limit: 626350, rate: 0.35 }, { limit: Infinity, rate: 0.37 }],
  married: [{ limit: 23850, rate: 0.10 }, { limit: 96950, rate: 0.12 }, { limit: 206700, rate: 0.22 }, { limit: 394600, rate: 0.24 }, { limit: 501050, rate: 0.32 }, { limit: 751600, rate: 0.35 }, { limit: Infinity, rate: 0.37 }],
  hoh:     [{ limit: 17000, rate: 0.10 }, { limit: 64850, rate: 0.12 }, { limit: 103350, rate: 0.22 }, { limit: 197300, rate: 0.24 }, { limit: 250500, rate: 0.32 }, { limit: 626350, rate: 0.35 }, { limit: Infinity, rate: 0.37 }],
};

function taxOnGain(income, gain, brackets) {
  // Tax is on the gain that falls above current income band
  let totalIncome = income + gain;
  let taxOnTotal = calcTax(totalIncome, brackets);
  let taxOnIncome = calcTax(income, brackets);
  return Math.max(0, taxOnTotal - taxOnIncome);
}

function calcTax(amount, brackets) {
  let tax = 0, prev = 0;
  for (const b of brackets) {
    const slice = Math.min(amount, b.limit) - prev;
    if (slice <= 0) break;
    tax += slice * b.rate;
    prev = b.limit;
    if (amount <= b.limit) break;
  }
  return tax;
}

function App() {
  const [filing, setFiling] = useState('single');
  const [income, setIncome] = useState(85000);
  const [gain, setGain] = useState(25000);
  const [term, setTerm] = useState('long');
  const [stateRate, setStateRate] = useState(0);
  const [costBasis, setCostBasis] = useState(50000);
  const [salePrice, setSalePrice] = useState(75000);

  const netGain = Math.max(0, (Number(salePrice)||0) - (Number(costBasis)||0));
  const actualGain = gain !== undefined ? Number(gain) : netGain;
  const inc = Number(income)||0;
  const g = Number(gain)||0;

  const brackets = term === 'long' ? LTCG_BRACKETS[filing] : ST_BRACKETS[filing];
  const fedTax = term === 'long' ? taxOnGain(inc, g, brackets) : taxOnGain(inc, g, ST_BRACKETS[filing]);

  // NIIT: 3.8% on lesser of (net investment income or MAGI exceeding threshold)
  const niitThreshold = filing === 'married' ? 250000 : 200000;
  const niit = term === 'long' && inc + g > niitThreshold ? Math.min(g, inc + g - niitThreshold) * 0.038 : 0;

  const stateTax = g * (Number(stateRate)||0) / 100;
  const totalTax = fedTax + niit + stateTax;
  const effectiveRate = g > 0 ? totalTax / g * 100 : 0;
  const netProceeds = g - totalTax;

  return (
    <div style={{maxWidth:520,margin:'0 auto',paddingBottom:40}}>
      <div style={{background:'#1a1a2e',padding:'12px 20px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <a href="https://tabutility.com" style={{color:'#a5b4fc',textDecoration:'none',fontSize:14}}>← All Tools</a>
        <span style={{color:'#fff',fontWeight:700,fontSize:15}}>⚡ Tabutility</span>
      </div>
      <div style={{background:'linear-gradient(135deg,#1e3a5f,#1a56db)',padding:'28px 20px',textAlign:'center',color:'#fff'}}>
        <div style={{fontSize:36,marginBottom:8}}>🇺🇸</div>
        <h1 style={{margin:'0 0 6px',fontSize:22,fontWeight:900}}>US Capital Gains Tax</h1>
        <p style={{margin:0,fontSize:13,opacity:0.85}}>2026 — Short & long term · NIIT · state tax</p>
      </div>
      <div style={{padding:20}}>
        <div style={{background:'#fff',borderRadius:14,padding:20,boxShadow:'0 2px 12px rgba(0,0,0,0.06)',marginBottom:16}}>
          <div style={{display:'flex',gap:8,marginBottom:14}}>
            {[['long','Long-Term (>1 yr)'],['short','Short-Term (≤1 yr)']].map(([v,l])=>(
              <button key={v} onClick={()=>setTerm(v)} style={{flex:1,padding:'9px',borderRadius:10,border:`2px solid ${term===v?'#1a56db':'#e5e7eb'}`,background:term===v?'#1a56db':'#fff',color:term===v?'#fff':'#374151',fontWeight:600,cursor:'pointer',fontSize:12}}>{l}</button>
            ))}
          </div>

          <div style={{marginBottom:12}}>
            <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:6}}>Filing Status</label>
            <select value={filing} onChange={e=>setFiling(e.target.value)}
              style={{width:'100%',padding:'10px',borderRadius:10,border:'2px solid #e5e7eb',fontSize:14,background:'#fff'}}>
              <option value="single">Single</option>
              <option value="married">Married Filing Jointly</option>
              <option value="hoh">Head of Household</option>
            </select>
          </div>

          {[['Other Income (W-2, etc.)','$',income,setIncome],['Capital Gain','$',gain,setGain]].map(([l,p,v,s])=>(
            <div key={l} style={{marginBottom:12}}>
              <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:6}}>{l}</label>
              <div style={{position:'relative'}}>
                <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'#6b7280'}}>{p}</span>
                <input type="number" value={v} onChange={e=>s(e.target.value)}
                  style={{width:'100%',padding:'11px 12px 11px 28px',borderRadius:10,border:'2px solid #e5e7eb',fontSize:16,boxSizing:'border-box'}} />
              </div>
            </div>
          ))}
          <div>
            <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:6}}>State Tax Rate: <span style={{color:'#1a56db'}}>{stateRate}%</span></label>
            <input type="range" min={0} max={15} step={0.1} value={stateRate} onChange={e=>setStateRate(e.target.value)} style={{width:'100%',accentColor:'#1a56db'}} />
            <div style={{fontSize:11,color:'#9ca3af'}}>CA: 13.3% · NY: 10.9% · TX/FL: 0%</div>
          </div>
        </div>

        <div style={{background:'linear-gradient(135deg,#eff6ff,#dbeafe)',borderRadius:14,padding:24,textAlign:'center',marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:700,color:'#1e3a8a'}}>TOTAL TAX ON GAIN</div>
          <div style={{fontSize:48,fontWeight:900,color:'#1a56db',margin:'6px 0'}}>{fmt(totalTax)}</div>
          <div style={{fontSize:14,color:'#1e40af'}}>Effective rate: {effectiveRate.toFixed(1)}%</div>
        </div>

        <div style={{background:'#fff',borderRadius:14,padding:20,boxShadow:'0 2px 12px rgba(0,0,0,0.06)'}}>
          {[
            ['Capital Gain', fmt(g)],
            ['Federal CGT ('+term+')', fmt(fedTax)],
            ...(niit>0?[['NIIT (3.8%)', fmt(niit)]]:[]),
            ...(stateTax>0?[['State Tax ('+stateRate+'%)', fmt(stateTax)]]:[]),
            ['Total Tax', fmt(totalTax)],
            ['Effective Rate', effectiveRate.toFixed(2)+'%'],
            ['Net After Tax', fmt(Math.max(0,g-totalTax))],
          ].map(([l,v])=>(
            <div key={l} style={{display:'flex',justifyContent:'space-between',padding:'9px 0',borderBottom:'1px solid #f0f0f0',fontSize:14}}>
              <span style={{color:'#6b7280'}}>{l}</span><strong>{v}</strong>
            </div>
          ))}
        </div>
        <div style={{background:'#eff6ff',borderRadius:12,padding:16,marginTop:16,fontSize:13,color:'#1e3a8a',lineHeight:1.6}}>
          <strong>Long-term CGT rates 2026:</strong> 0% (income ≤$48,350 single/$96,700 MFJ), 15% up to $533,400/$600,050, 20% above. NIIT 3.8% applies when MAGI exceeds $200,000 ($250,000 MFJ). Short-term gains are taxed as ordinary income.
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
//]]>
</script>
</body>
